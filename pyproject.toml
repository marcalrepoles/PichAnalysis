[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pichanalysis"
dynamic = ["version"]
description = "Desktop foundation for reproducible proteomics data analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "xlrd>=2.0.1",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pichanalysis = "pichanalysis.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "pichanalysis.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
